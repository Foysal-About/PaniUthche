name: Daily flood forecast

on:
  schedule:
    - cron: "30 0,12 * * *"   # 06:30 and 18:30 Bangladesh time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/forecast.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  forecast:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements-forecast.txt
      - run: pip install -r requirements-forecast.txt
      - run: python forecast.py
      - run: cp model/metrics.json out/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ml/out
      - id: deploy
        uses: actions/deploy-pages@v4
